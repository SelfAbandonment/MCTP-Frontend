name: Fork PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: string
      run_id:
        description: CI run id (optional; resolved from PR head if empty)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
       github.event.pull_request.user.login == 'Limor14514')
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      number: ${{ steps.resolve.outputs.number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve PR and CI run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          PR="$PR_NUMBER"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number"
            exit 1
          fi
          info=$(gh api "repos/$REPO/pulls/$PR")
          if [ "$(jq -r .state <<<"$info")" != "open" ]; then
            echo "::notice::PR is closed; skipping preview"
            exit 0
          fi
          HEAD_SHA=$(jq -r .head.sha <<<"$info")
          HEAD_REPO=$(jq -r .head.repo.full_name <<<"$info")
          PR_AUTHOR=$(jq -r .user.login <<<"$info")

          if [ "$HEAD_REPO" = "$REPO" ]; then
            echo "same-repo PR is handled by ci.yml preview"
            exit 0
          fi
          if [ "$PR_AUTHOR" != "Limor14514" ]; then
            echo "author $PR_AUTHOR is not in fork preview allowlist"
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_RUN_ID" ]; then
            if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid CI run id"
              exit 1
            fi
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run found for the current PR head; rerun after CI starts"
            exit 1
          fi

          WORKFLOW_ID=$(gh api "repos/$REPO/actions/workflows/ci.yml" --jq '.id')
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
            if ! jq -e --arg sha "$HEAD_SHA" --arg repo "$HEAD_REPO" --argjson workflow "$WORKFLOW_ID" \
              '.head_sha == $sha and .head_repository.full_name == $repo and .event == "pull_request" and .workflow_id == $workflow' \
              <<<"$run" >/dev/null; then
              echo "::error::CI run does not match this PR revision and workflow"
              exit 1
            fi
            status=$(jq -r .status <<<"$run")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run")
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "CI run $RUN_ID completed as $conclusion; skip preview"
                exit 0
              fi
              break
            fi
            sleep 15
          done
          if [ "$status" != "completed" ]; then
            echo "CI run $RUN_ID did not finish in time"
            exit 1
          fi
          info=$(gh api "repos/$REPO/pulls/$PR")
          if ! jq -e --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' <<<"$info" >/dev/null; then
            echo "::notice::PR closed or superseded during CI; skipping preview"
            exit 0
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  preview:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check PR is still open
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          info=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          ready=$(jq -r --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' <<<"$info")
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "::notice::PR closed or superseded; skipping preview"
          fi

      # 与 ci.yml 的 preview 相同：PR 改了 showcase/ 时优先部署 showcase-dist，没有就用主应用的 dist
      - name: Download showcase dist artifact
        id: showcase
        if: steps.pr.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: showcase-dist
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Download dist artifact
        if: steps.pr.outputs.ready == 'true' && steps.showcase.outcome != 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Deploy preview to gh-pages
        if: steps.pr.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ needs.resolve.outputs.number }}
          keep_files: true

      - name: Upsert preview comment
        if: steps.pr.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          PREVIEW_URL: https://selfabandonment.github.io/MCTP-Frontend/preview/pr-${{ needs.resolve.outputs.number }}/
        run: |
          set -e
          body=$(printf '<!-- mctp-preview -->\n### 预览已更新\n\n%s\n\n> 由 GitHub Actions 自动部署；PR 关闭后清理。' "$PREVIEW_URL")
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- mctp-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
            echo "已更新预览评论 #$id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "已创建预览评论"
          fi
