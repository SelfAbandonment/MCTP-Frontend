name: Fork PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: string
      run_id:
        description: CI run id (optional; resolved from PR head if empty)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: preview-fork-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
       github.event.pull_request.user.login == 'Limor14514')
    steps:
      - name: Resolve PR and CI run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          PR="$PR_NUMBER"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "pull_request_target" ]; then
            info=$(gh api "repos/$REPO/pulls/$PR")
            HEAD_SHA=$(jq -r .head.sha <<<"$info")
            HEAD_REPO=$(jq -r .head.repo.full_name <<<"$info")
            PR_AUTHOR=$(jq -r .user.login <<<"$info")
          fi

          if [ "$HEAD_REPO" = "$REPO" ]; then
            echo "same-repo PR is handled by ci.yml preview"
            exit 0
          fi
          if [ "$PR_AUTHOR" != "Limor14514" ]; then
            echo "author $PR_AUTHOR is not in fork preview allowlist"
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "no CI run found for $HEAD_SHA"
            exit 0
          fi

          for _ in $(seq 1 60); do
            status=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
            conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion // empty')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "CI run $RUN_ID completed as $conclusion; skip preview"
                exit 0
              fi
              break
            fi
            sleep 15
          done
          if [ "$status" != "completed" ]; then
            echo "CI run $RUN_ID did not finish in time"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download dist artifact
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Deploy preview to gh-pages
        if: steps.resolve.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ steps.resolve.outputs.number }}
          keep_files: true

      - name: Upsert preview comment
        if: steps.resolve.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
          PREVIEW_URL: https://selfabandonment.github.io/MCTP-Frontend/preview/pr-${{ steps.resolve.outputs.number }}/
        run: |
          set -e
          body=$(printf '<!-- mctp-preview -->\n### 预览已更新\n\n%s\n\n> 由 GitHub Actions 自动部署；PR 关闭后清理。' "$PREVIEW_URL")
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- mctp-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
            echo "已更新预览评论 #$id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "已创建预览评论"
          fi
