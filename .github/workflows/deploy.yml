name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署串行执行，不取消进行中的部署，避免 gh-pages 互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate production API
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::仓库变量 VITE_API_BASE_URL 未设置。到 Settings → Secrets and variables → Actions → Variables 添加 HTTPS 的后端地址。"
            exit 1
          fi
          node --input-type=module -e "
            const raw = process.env.API_BASE_URL;
            let url;
            try { url = new URL(raw) } catch { throw new Error('VITE_API_BASE_URL 不是合法 URL：' + raw) }
            if (url.protocol !== 'https:') {
              throw new Error('GitHub Pages 走 HTTPS，后端也必须是 HTTPS：' + raw);
            }
          "

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
