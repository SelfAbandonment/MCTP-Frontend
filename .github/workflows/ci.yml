name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Unit tests (JUnit + coverage gate)
        run: |
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=junit.xml > coverage.txt 2>&1

      - name: Normalize JUnit report
        if: always() && hashFiles('junit.xml') != ''
        run: node scripts/junit-normalize.mjs junit.xml

      - name: Check coverage
        if: always() && hashFiles('coverage.txt') != ''
        run: node scripts/coverage-gate.mjs coverage.txt 70

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment CI report on PR
        id: pr_comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pr-comment.mjs

      - name: Report PR comment failure
        if: always() && steps.pr_comment.outcome == 'failure'
        run: echo "::warning::PR CI report comment failed; see the comment step logs"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # showcase/ 是独立的展示站子工程（自带 package.json），根目录的 lint / build 不会检查它，这里单独构建一次作为门禁。
  # PR 改动了 showcase/ 时，额外上传 showcase-dist，预览任务会优先部署它（否则仍部署主应用的 dist）。
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # PR 的合并提交 + 它的第一个父提交（目标分支），用来判断 showcase/ 有没有改动

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: showcase/package-lock.json

      - name: Detect showcase changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --quiet HEAD^1 HEAD -- showcase/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install showcase dependencies
        working-directory: showcase
        run: npm ci

      # PR 预览部署在 gh-pages 的 preview/pr-<编号>/ 子路径下：base 指向这个子路径，
      # 并用 hash 路由（GitHub Pages 只认站点根目录的 404.html，子路径下直接打开 /home 会 404）。
      - name: Build showcase
        working-directory: showcase
        env:
          SHOWCASE_BASE: ${{ github.event_name == 'pull_request' && format('/{0}/preview/pr-{1}/', github.event.repository.name, github.event.pull_request.number) || '/' }}
          VITE_ROUTER_MODE: hash
        run: npm run build

      - name: Upload showcase dist
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist
          path: showcase/dist
          if-no-files-found: error
          retention-days: 7

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, showcase]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Check PR is still open
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          info=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          ready=$(jq -r --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' <<<"$info")
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "::notice::PR closed or superseded; skipping preview"
          fi

      # PR 改了 showcase/ 时 showcase 任务会上传 showcase-dist，优先部署它；没有这个产物时下载失败，改用主应用的 dist
      - name: Download showcase dist
        id: showcase
        if: steps.pr.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: showcase-dist
          path: dist

      - name: Download dist
        if: steps.pr.outputs.ready == 'true' && steps.showcase.outcome != 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy preview to gh-pages
        if: steps.pr.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Upsert preview comment
        if: steps.pr.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://selfabandonment.github.io/MCTP-Frontend/preview/pr-${{ github.event.pull_request.number }}/
        run: |
          set -e
          body=$(printf '<!-- mctp-preview -->\n### 预览已更新\n\n%s\n\n> 由 GitHub Actions 自动部署；PR 关闭后清理。' "$PREVIEW_URL")
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- mctp-preview -->")) | .id')
          id=$(printf '%s\n' "$ids" | sed -n '1p')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
            printf '%s\n' "$ids" | sed -n '2,$p' | while IFS= read -r duplicate; do
              [ -z "$duplicate" ] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${duplicate}" >/dev/null
            done
            echo "已更新预览评论 #$id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "已新增预览评论"
          fi

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # 保留现有 advisory 策略；必需 job 存在不等于断言阻塞合并。
      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Report advisory failure
        if: always() && steps.lighthouse.outcome == 'failure'
        run: |
          echo "::warning::Lighthouse failed; this check remains advisory"
          echo "### Lighthouse advisory failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the Lighthouse logs and artifacts; assertions do not currently block merging." >> "$GITHUB_STEP_SUMMARY"

  notify:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [lint, test, build, showcase, lighthouse, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Notify Jenkins
        id: notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || '' }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed_jobs=""
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}" \
            "build:${{ needs.build.result }}" \
            "lighthouse:${{ needs.lighthouse.result }}" \
            "preview:${{ needs.preview.result }}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ]; then
              failed_jobs="${failed_jobs}${failed_jobs:+, }${job}"
            fi
          done
          status=failure
          title="MCTP-FE CI 失败"
          notification_details="失败检查: $failed_jobs"
          if [ -z "$failed_jobs" ]; then
            required_jobs="lint:${{ needs.lint.result }} test:${{ needs.test.result }} build:${{ needs.build.result }} lighthouse:${{ needs.lighthouse.result }}"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              required_jobs="$required_jobs preview:${{ needs.preview.result }}"
            fi
            incomplete_jobs=""
            for pair in $required_jobs; do
              job="${pair%%:*}"
              result="${pair#*:}"
              if [ "$result" != "success" ]; then
                incomplete_jobs="${incomplete_jobs}${incomplete_jobs:+, }${job}=${result}"
              fi
            done
            if [ -n "$incomplete_jobs" ]; then
              echo "当前 CI 未全部成功（$incomplete_jobs），跳过恢复通知"
              exit 0
            fi
            previous=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f "branch=$BRANCH" -f "event=$GITHUB_EVENT_NAME" -f per_page=100 |
              jq -r --argjson current "$GITHUB_RUN_ID" \
                '[.workflow_runs[] | select(.id < $current and .status == "completed" and (.conclusion == "success" or .conclusion == "failure"))] | max_by(.id).conclusion // ""')
            if [ "$previous" = "failure" ]; then
              status=fixed
              title="MCTP-FE CI 已恢复"
              notification_details="此前失败的 CI 检查已通过"
            elif [ "$GITHUB_EVENT_NAME" = "push" ] &&
                 { [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; }; then
              status=success
              title="MCTP-FE CI 通过"
              notification_details="所有必需检查通过"
            else
              echo "此事件无需发送成功通知"
              exit 0
            fi
          fi
          latest_run=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "branch=$BRANCH" -f "event=$GITHUB_EVENT_NAME" -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [ "$latest_run" != "$GITHUB_RUN_ID" ]; then
            echo "::notice::A newer run exists for $BRANCH; skipping stale notification"
            exit 0
          fi
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_USER" ] || [ -z "$JENKINS_TOKEN" ]; then
            echo "::error::Jenkins notification secrets are not configured"
            exit 1
          fi
          BASE="${JENKINS_URL%/}"
          DETAILS="${notification_details}; commit ${GITHUB_SHA:0:7}"
          curl -fsS --connect-timeout 10 --max-time 30 -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -X POST "$BASE/job/MCTP-Notify/buildWithParameters" \
            --data-urlencode "REPO=MCTP-FE" \
            --data-urlencode "EVENT=ci" \
            --data-urlencode "STATUS=$status" \
            --data-urlencode "TITLE=$title" \
            --data-urlencode "BRANCH=$BRANCH" \
            --data-urlencode "PR=$PR_NUMBER" \
            --data-urlencode "ACTOR=$ACTOR" \
            --data-urlencode "URL=$BUILD_URL" \
            --data-urlencode "DETAILS=$DETAILS"

      - name: Report notification failure
        if: always() && steps.notification.outcome == 'failure'
        run: echo "::warning::Jenkins notification failed; see the notification step logs"
