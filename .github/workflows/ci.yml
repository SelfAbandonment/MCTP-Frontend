name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Unit tests (JUnit + coverage gate)
        run: |
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=junit.xml > coverage.txt 2>&1

      - name: Normalize JUnit report
        if: always() && hashFiles('junit.xml') != ''
        run: node scripts/junit-normalize.mjs junit.xml

      - name: Check coverage
        if: always() && hashFiles('coverage.txt') != ''
        run: node scripts/coverage-gate.mjs coverage.txt 70

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment CI report on PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pr-comment.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Check PR is still open
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          info=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          ready=$(jq -r --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' <<<"$info")
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "::notice::PR closed or superseded; skipping preview"
          fi

      - name: Download dist
        if: steps.pr.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy preview to gh-pages
        if: steps.pr.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Upsert preview comment
        if: steps.pr.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://selfabandonment.github.io/MCTP-Frontend/preview/pr-${{ github.event.pull_request.number }}/
        run: |
          set -e
          body=$(printf '<!-- mctp-preview -->\n### 预览已更新\n\n%s\n\n> 由 GitHub Actions 自动部署；PR 关闭后清理。' "$PREVIEW_URL")
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- mctp-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
            echo "已更新预览评论 #$id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "已新增预览评论"
          fi

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # 保留现有 advisory 策略；必需 job 存在不等于断言阻塞合并。
      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Report advisory failure
        if: always() && steps.lighthouse.outcome == 'failure'
        run: |
          echo "::warning::Lighthouse failed; this check remains advisory"
          echo "### Lighthouse advisory failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the Lighthouse logs and artifacts; assertions do not currently block merging." >> "$GITHUB_STEP_SUMMARY"

  notify:
    if: >-
      always() && contains(needs.*.result, 'failure') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [lint, test, build, lighthouse, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Jenkins
        id: notification
        continue-on-error: true
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_USER" ] || [ -z "$JENKINS_TOKEN" ]; then
            echo "::error::Jenkins notification secrets are not configured"
            exit 1
          fi
          BASE="${JENKINS_URL%/}"
          curl -fsS --connect-timeout 10 --max-time 30 -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -X POST "$BASE/job/MCTP-Notify/buildWithParameters" \
            --data-urlencode "REPO=MCTP-FE" \
            --data-urlencode "STATUS=failure" \
            --data-urlencode "TITLE=MCTP-FE CI 失败" \
            --data-urlencode "BRANCH=$BRANCH" \
            --data-urlencode "PR=$PR_NUMBER" \
            --data-urlencode "URL=$BUILD_URL" \
            --data-urlencode "DETAILS=GitHub Actions 构建失败"

      - name: Report notification failure
        if: always() && steps.notification.outcome == 'failure'
        run: echo "::warning::Jenkins notification failed; see the notification step logs"
